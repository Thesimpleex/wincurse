[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wincurse"
version = "0.1.0"
description = "Selection-corrected Sharpe ratios: median-unbiased estimates and valid confidence intervals for the best of many backtests."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Majores" }]
keywords = ["sharpe-ratio", "backtesting", "selection-bias", "inference-on-winners", "multiple-testing", "quantitative-finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",
  "rich>=13.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
parquet = ["pyarrow>=14"]
arch = ["arch>=7.0"]
docs = ["matplotlib>=3.8", "playwright>=1.45", "arch>=7.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "matplotlib>=3.8", "mpmath>=1.3", "arch>=7.0", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/Thesimpleex/wincurse"
Issues = "https://github.com/Thesimpleex/wincurse/issues"

[project.scripts]
wincurse = "wincurse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wincurse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "NPY", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/wincurse/report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wincurse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running statistical tests"]
